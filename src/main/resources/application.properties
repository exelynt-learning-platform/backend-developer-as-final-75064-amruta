# ==========================================
# APPLICATION
# ==========================================

spring.application.name=resource-booking-system

server.port=8080


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SEED USER CREDENTIALS
# ==========================================

seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
seed.user.password=${SEED_USER_PASSWORD:user123}


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Use 'validate' by default for production safety to prevent automatic destructive schema mutations.
# Set JPA_DDL_AUTO=update or JPA_DDL_AUTO=create-drop only in development environments if required.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# JWT
# ==========================================

# Provide a development fallback (256-bit Base64-encoded secret key) if JWT_SECRET is not set in environment.
# In production, always supply a strong, unique secret via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNhbXBsZS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==}
jwt.expiration=86400000


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html