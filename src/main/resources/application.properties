# ==========================================
# APPLICATION
# ==========================================

spring.application.name=resource-booking-system

server.port=8080


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/resource_booking_db
spring.datasource.username=postgres
spring.datasource.password=Amruta@123
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# JWT
# ==========================================

jwt.secret=MyVeryLongSecretKeyForResourceBookingSystemJWT2026SecureKey
jwt.expiration=86400000


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html