# ==========================================
# APPLICATION
# ==========================================

spring.application.name=resource-booking-system

server.port=8080


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SQL INITIALIZATION & SCHEMA EXECUTION
# ==========================================

# Automatically execute schema.sql on application startup
spring.sql.init.mode=always

# ==========================================
# SEED USER CREDENTIALS & IDENTITIES
# ==========================================

seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.email=${SEED_ADMIN_EMAIL:admin@example.com}
# Seed user passwords must be provided via environment variables (no hardcoded fallback)
seed.admin.password=${SEED_ADMIN_PASSWORD:}

seed.user.username=${SEED_USER_USERNAME:user}
seed.user.email=${SEED_USER_EMAIL:user@example.com}
seed.user.password=${SEED_USER_PASSWORD:}


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Schema is initialized via schema.sql; JPA validates schema against entities
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# JWT
# ==========================================

# Required: Base64-encoded 256-bit secret key (must be provided via JWT_SECRET environment variable).
# The application will validate this configuration and fail fast on startup if not set.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html