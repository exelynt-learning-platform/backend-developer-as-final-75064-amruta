# ==========================================
# APPLICATION
# ==========================================

spring.application.name=resource-booking-system

server.port=8080


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resource_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# SEED USER CREDENTIALS
# ==========================================

seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
seed.user.password=${SEED_USER_PASSWORD:user123}


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Defaults to 'update' in development. In production environments, set JPA_DDL_AUTO=validate.
# Database schema creation script is provided in schema.sql.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==========================================
# JWT
# ==========================================

# Required: Base64-encoded 256-bit secret key (must be provided via JWT_SECRET environment variable).
# The application will validate this configuration and fail fast on startup if not set.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html